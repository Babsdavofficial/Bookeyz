<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reading - Bookeyz</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/reader.css">
</head>

<body class="reader-page">

    <!-- =========================
         READER NAVBAR
    ========================== -->

    <header class="reader-navbar">

        <div class="reader-navbar-inner">

            <a href="../index.html" class="reader-logo">
                Bookeyz
            </a>

            <div class="reader-actions">

                <a href="book.html" class="reader-back">
                    ← Back to Book
                </a>

            </div>

        </div>

    </header>


    <!-- =========================
         READING PROGRESS
    ========================== -->

    <div class="reading-progress-container">

        <div id="readingProgress" class="reading-progress"></div>

    </div>


    <!-- =========================
         READER CONTENT
    ========================== -->

    <main class="reader-main">

        <article class="reading-container">


            <!-- BOOK INFORMATION -->

            <div class="reader-book-info">

                <p id="readerCategory" class="reader-category">
                    FANTASY
                </p>

                <h1 id="readerBookTitle">
                    Beast World: The Fire Dragon Quest
                </h1>

                <p id="readerAuthor" class="reader-author">
                    By Bookeyz
                </p>

            </div>


            <!-- CHAPTER HEADER -->

            <header class="chapter-header">

                <p id="chapterNumber" class="chapter-number">
                    CHAPTER 1
                </p>

                <h2 id="chapterTitle">
                    The Festival Before the Storm
                </h2>

                <div class="chapter-divider"></div>

            </header>


            <!-- CHAPTER ARTWORK -->

            <div class="chapter-artwork">

                <div class="artwork-placeholder">

                    <span id="artworkText">
                        Chapter Artwork
                    </span>

                </div>

            </div>


            <!-- STORY -->

            <section
                class="story-content"
                id="storyContent">

            </section>


            <!-- CHAPTER NAVIGATION -->

            <nav class="chapter-navigation">

                <a
                    href="#"
                    id="previousChapter"
                    class="chapter-nav-button">

                    ←
                    <span>
                        Previous
                    </span>

                </a>


                <a
                    href="book.html"
                    class="chapter-nav-center">

                    <span class="chapter-nav-small">
                        CHAPTER
                    </span>

                    <strong id="currentChapterNumber">
                        1
                    </strong>

                </a>


                <a
                    href="#"
                    id="nextChapter"
                    class="chapter-nav-button">

                    <span>
                        Next
                    </span>

                    →

                </a>

            </nav>


            <!-- READER FOOTER -->

            <div class="reader-footer">

                <p>
                    You're reading on Bookeyz.
                </p>

                <a href="../index.html">
                    Return to Bookeyz
                </a>

            </div>


        </article>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script type="module" src="../js/reader.js"></script>

</body>

</html>
