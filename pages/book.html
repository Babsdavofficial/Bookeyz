<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Book — Bookeyz</title>

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>


<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <a
            href="../index.html"
            class="logo">

            Bookeyz

        </a>


        <nav>

            <a href="../index.html">
                Home
            </a>

            <a href="books.html">
                Books
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- =========================
         BOOK DETAILS
    ========================== -->

    <main>

        <section class="book-detail">

            <!-- COVER -->

            <div class="book-detail-cover">

                <div
                    id="bookCover"
                    class="cover-placeholder">

                    BK

                </div>

            </div>


            <!-- BOOK INFORMATION -->

            <div class="book-detail-content">

                <p
                    id="bookCategory"
                    class="book-category">

                    Loading...

                </p>


                <h1 id="bookTitle">

                    Loading book...

                </h1>


                <p
                    id="bookAuthor"
                    class="book-author">

                    Loading author...

                </p>


                <p
                    id="bookDescription"
                    class="book-description">

                    Loading description...

                </p>


                <div
                    id="bookStats"
                    class="book-stats">

                    <span>
                        Loading...
                    </span>

                </div>


                <div class="book-actions">

                    <a
                        href="#"
                        id="startReading"
                        class="primary-button">

                        Start Reading

                    </a>


                    <button
                        type="button"
                        class="secondary-button">

                        Save Book

                    </button>

                </div>

            </div>

        </section>


        <!-- =========================
             CHAPTERS
        ========================== -->

        <section class="section">

            <div class="section-heading">

                <div>

                    <p class="section-label">
                        STORY
                    </p>

                    <h2>
                        Chapters
                    </h2>

                </div>

            </div>


            <div
                class="chapter-list"
                id="chapterList">

                <p>
                    Loading chapters...
                </p>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="footer-logo">
            Bookeyz
        </div>

        <p>
            Stories worth getting lost in.
        </p>

    </footer>


    <!-- =========================
         FIREBASE
    ========================== -->

    <script type="module">

        import {
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        import {
            db
        } from "../js/firebase-config.js";


        // =========================
        // GET BOOK ID FROM URL
        // =========================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const bookId =
            urlParams.get("id");


        // =========================
        // PAGE ELEMENTS
        // =========================

        const bookCover =
            document.getElementById(
                "bookCover"
            );


        const bookCategory =
            document.getElementById(
                "bookCategory"
            );


        const bookTitle =
            document.getElementById(
                "bookTitle"
            );


        const bookAuthor =
            document.getElementById(
                "bookAuthor"
            );


        const bookDescription =
            document.getElementById(
                "bookDescription"
            );


        const bookStats =
            document.getElementById(
                "bookStats"
            );


        const startReading =
            document.getElementById(
                "startReading"
            );


        const chapterList =
            document.getElementById(
                "chapterList"
            );


        // =========================
        // LOAD BOOK
        // =========================

        async function loadBook() {

            if (!bookId) {

                showError(
                    "No book was selected."
                );

                return;

            }


            try {

                const bookReference =
                    doc(
                        db,
                        "books",
                        bookId
                    );


                const bookSnapshot =
                    await getDoc(
                        bookReference
                    );


                if (!bookSnapshot.exists()) {

                    showError(
                        "This book could not be found."
                    );

                    return;

                }


                const book =
                    bookSnapshot.data();


                // =========================
                // BOOK INFORMATION
                // =========================

                document.title =
                    `${book.title || "Book"} — Bookeyz`;


                bookCategory.textContent =
                    book.category ||
                    "Uncategorized";


                bookTitle.textContent =
                    book.title ||
                    "Untitled Book";


                bookAuthor.textContent =
                    `By ${book.author || "Unknown Author"}`;


                bookDescription.textContent =
                    book.description ||
                    "No description available.";


                // =========================
                // COVER
                // =========================

                if (book.coverImage) {

                    bookCover.innerHTML = `

                        <img
                            src="${book.coverImage}"
                            alt="${book.title || "Book"} cover"
                            style="
                                width: 100%;
                                height: 100%;
                                object-fit: cover;
                                border-radius: 10px;
                            "
                        >

                    `;

                } else {

                    bookCover.textContent =
                        getInitials(
                            book.title
                        );

                }


                // =========================
                // BOOK STATS
                // =========================

                const rating =
                    book.ratingAverage;


                const chapterCount =
                    book.chapterCount || 0;


                const isFree =
                    book.free === true;


                bookStats.innerHTML = `

                    <span>
                        ★ ${rating || "New"}
                    </span>

                    <span>
                        ${chapterCount} Chapters
                    </span>

                    <span>
                        ${isFree ? "Free" : "Paid"}
                    </span>

                `;


                // =========================
                // START READING
                // =========================

                startReading.href =
                    `reader.html?book=${bookId}&chapter=1`;


                // =========================
                // LOAD CHAPTERS
                // =========================

                loadChapters(
                    bookId
                );


            } catch (error) {

                console.error(
                    "BOOK DETAILS ERROR:",
                    error
                );


                showError(
                    error.message
                );

            }

        }


        // =========================
        // LOAD CHAPTERS
        // =========================

        async function loadChapters(
            bookId
        ) {

            /*
             * Chapters will be connected
             * properly in Stage 9.
             *
             * For now we keep the
             * existing chapter area
             * as a placeholder.
             */

            chapterList.innerHTML = `

                <p>
                    Chapters will appear here
                    when the reader is connected
                    to Firestore.
                </p>

            `;

        }


        // =========================
        // ERROR MESSAGE
        // =========================

        function showError(
            message
        ) {

            bookTitle.textContent =
                "Unable to load book";


            bookDescription.textContent =
                message;


            chapterList.innerHTML = "";

        }


        // =========================
        // INITIALS
        // =========================

        function getInitials(
            title
        ) {

            if (!title) {

                return "BK";

            }


            const words =
                title
                    .trim()
                    .split(/\s+/);


            if (
                words.length === 1
            ) {

                return words[0]
                    .substring(0, 2)
                    .toUpperCase();

            }


            return (
                words[0][0] +
                words[1][0]
            ).toUpperCase();

        }


        // =========================
        // START
        // =========================

        loadBook();

    </script>

</body>

</html>
