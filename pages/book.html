    <!-- =========================
         FIREBASE
    ========================== -->

    <script type="module">

    import {
    doc,
    getDoc,
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    updateDoc,
    query,
    where,
    orderBy,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


       import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    auth,
    db
} from "../js/firebase-config.js";


        // =========================
        // GET BOOK ID FROM URL
        // =========================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const bookId =
            urlParams.get("id");


        // =========================
        // PAGE ELEMENTS
        // =========================

        const bookCover =
            document.getElementById(
                "bookCover"
            );


        const bookCategory =
            document.getElementById(
                "bookCategory"
            );


        const bookTitle =
            document.getElementById(
                "bookTitle"
            );


        const bookAuthor =
            document.getElementById(
                "bookAuthor"
            );


        const bookDescription =
            document.getElementById(
                "bookDescription"
            );


        const bookStats =
            document.getElementById(
                "bookStats"
            );


        const startReading =
            document.getElementById(
                "startReading"
            );


        const chapterList =
            document.getElementById(
                "chapterList"
            );

        const saveBookButton =
    document.getElementById(
        "saveBookButton"
    );

    const bookRating =
    document.getElementById(
        "bookRating"
    );

const ratingCount =
    document.getElementById(
        "ratingCount"
    );

    const readerCount =
    document.getElementById(
        "readerCount"
    );

const ratingStars =
    document.getElementById(
        "ratingStars"
    );

const ratingMessage =
    document.getElementById(
        "ratingMessage"
    );


        // =========================
        // LOAD BOOK
        // =========================

        async function loadBook() {

            if (!bookId) {

                showError(
                    "No book was selected."
                );

                return;

            }


            try {

                const bookReference =
                    doc(
                        db,
                        "books",
                        bookId
                    );


                const bookSnapshot =
                    await getDoc(
                        bookReference
                    );


                if (!bookSnapshot.exists()) {

                    showError(
                        "This book could not be found."
                    );

                    return;

                }


                const book =
                    bookSnapshot.data();


                // =========================
                // BOOK INFORMATION
                // =========================

                document.title =
                    `${book.title || "Book"} — Bookeyz`;


                bookCategory.textContent =
                    book.category ||
                    "Uncategorized";


                bookTitle.textContent =
                    book.title ||
                    "Untitled Book";


                bookAuthor.textContent =
                    `By ${book.author || "Unknown Author"}`;


                bookDescription.textContent =
                    book.description ||
                    "No description available.";


                // =========================
                // COVER
                // =========================

                if (book.coverImage) {

                    bookCover.innerHTML = `

                        <img
                            src="${book.coverImage}"
                            alt="${book.title || "Book"} cover"
                            style="
                                width: 100%;
                                height: 100%;
                                object-fit: cover;
                                border-radius: 10px;
                            "
                        >

                    `;

                } else {

                    bookCover.textContent =
                        getInitials(
                            book.title
                        );

                }


                // =========================
                // BOOK STATS
                // =========================

              const ratingTotal =
    Number(book.ratingTotal || 0);

const totalRatings =
    Number(book.ratingCount || 0);

const rating =
    totalRatings > 0
        ? ratingTotal / totalRatings
        : 0;

const isFree =
    book.free === true;

bookRating.textContent =
    rating > 0
        ? `★ ${rating.toFixed(1)}`
        : "★ New";

ratingCount.textContent =
    `${totalRatings} ${
        totalRatings === 1
            ? "rating"
            : "ratings"
    }`;

document.getElementById(
    "bookPrice"
).textContent =
    isFree
        ? "Free"
        : "Paid";


                // =========================
                // START READING
                // =========================

                startReading.href =
                    `reader.html?book=${bookId}&chapter=1`;


                // =========================
                // LOAD CHAPTERS
                // =========================

                loadChapters(
                bookId
            );


            } catch (error) {

                console.error(
                    "BOOK DETAILS ERROR:",
                    error
                );


                showError(
                    error.message
                );

            }

        }


        let currentUser = null;
let savedBookDocumentId = null;

onAuthStateChanged(auth, async (user) => {

    currentUser = user;

    if (!user) {

        saveBookButton.textContent =
            "Login to Save";

        return;
    }

    await checkIfBookIsSaved();

    await loadUserRating();

});


async function checkIfBookIsSaved() {

    if (!currentUser || !bookId) {
        return;
    }

    try {

        const savedBooksQuery = query(
            collection(db, "savedBooks"),

            where(
                "userId",
                "==",
                currentUser.uid
            ),

            where(
                "bookId",
                "==",
                bookId
            )
        );

        const snapshot =
            await getDocs(
                savedBooksQuery
            );

        if (!snapshot.empty) {

            savedBookDocumentId =
                snapshot.docs[0].id;

            saveBookButton.textContent =
                "Saved ✓";

        } else {

            savedBookDocumentId = null;

            saveBookButton.textContent =
                "Save Book";
        }

    } catch (error) {

        console.error(
            "CHECK SAVED BOOK ERROR:",
            error
        );

    }
}



saveBookButton.addEventListener(
    "click",
    async () => {

        if (!currentUser) {

            window.location.href =
                `login.html?redirect=${encodeURIComponent(
                    window.location.pathname +
                    window.location.search
                )}`;

            return;
        }

        try {

            if (savedBookDocumentId) {

                await deleteDoc(
                    doc(
                        db,
                        "savedBooks",
                        savedBookDocumentId
                    )
                );

                savedBookDocumentId = null;

                saveBookButton.textContent =
                    "Save Book";

                return;
            }


            const savedBook = await addDoc(
                collection(db, "savedBooks"),
                {
                    userId: currentUser.uid,
                    bookId: bookId,
                    savedAt: new Date()
                }
            );

            savedBookDocumentId =
                savedBook.id;

            saveBookButton.textContent =
                "Saved ✓";

        } catch (error) {

            console.error(
                "SAVE BOOK ERROR:",
                error
            );

            alert(
                "Unable to save this book right now."
            );

        }
    }
);





// =========================
// RATINGS
// =========================

let userRatingDocumentId = null;
let userRating = 0;


// -------------------------
// LOAD USER'S RATING
// -------------------------

async function loadUserRating() {

    if (!currentUser || !bookId) {
        return;
    }

    try {

        const ratingsQuery = query(
            collection(db, "ratings"),
            where("userId", "==", currentUser.uid),
            where("bookId", "==", bookId)
        );

        const snapshot = await getDocs(ratingsQuery);

        if (!snapshot.empty) {

            const ratingDocument = snapshot.docs[0];
            const ratingData = ratingDocument.data();

            userRatingDocumentId = ratingDocument.id;

            userRating =
                Number(ratingData.rating || 0);

            highlightRating(userRating);

        } else {

            userRatingDocumentId = null;
            userRating = 0;

        }

    } catch (error) {

        console.error(
            "LOAD USER RATING ERROR:",
            error
        );

    }

}
// -------------------------
// STAR CLICK
// -------------------------

if (ratingStars) {

    ratingStars
        .querySelectorAll("button")
        .forEach((button) => {

            button.addEventListener(
                "click",
                async () => {

                    const selectedRating =
                        Number(
                            button.dataset.rating
                        );

                    await submitRating(
                        selectedRating
                    );

                }
            );

        });

}


// -------------------------
// SUBMIT RATING
// -------------------------

async function submitRating(selectedRating) {

    if (!currentUser) {

        window.location.href =
            `login.html?redirect=${encodeURIComponent(
                window.location.pathname +
                window.location.search
            )}`;

        return;
    }

    if (
        selectedRating < 1 ||
        selectedRating > 5
    ) {
        return;
    }

    try {

        ratingMessage.textContent =
            "Saving rating...";

        const bookReference = doc(
            db,
            "books",
            bookId
        );

        const ratingReference = doc(
            db,
            "ratings",
            `${currentUser.uid}_${bookId}`
        );

        const transactionResult = await runTransaction(
            db,
            async (transaction) => {

                // Always read the book first.
                const bookSnapshot =
                    await transaction.get(
                        bookReference
                    );

                if (!bookSnapshot.exists()) {

                    throw new Error(
                        "This book could not be found."
                    );

                }

                const bookData =
                    bookSnapshot.data();

                const currentTotal =
                    Number(
                        bookData.ratingTotal || 0
                    );

                const currentCount =
                    Number(
                        bookData.ratingCount || 0
                    );


                // =========================
                // FIRST-TIME RATING
                // =========================

                if (!userRatingDocumentId) {

                    const newTotal =
                        currentTotal +
                        selectedRating;

                    const newCount =
                        currentCount + 1;


                    const ratingData = {

                        userId:
                            currentUser.uid,

                        bookId:
                            bookId,

                        rating:
                            selectedRating,

                        createdAt:
                            new Date(),

                        updatedAt:
                            new Date()

                    };


                    transaction.set(
                        ratingReference,
                        ratingData
                    );


                    transaction.update(
                        bookReference,
                        {
                            ratingTotal:
                                newTotal,

                            ratingCount:
                                newCount
                        }
                    );


                    return {

                        total:
                            newTotal,

                        count:
                            newCount

                    };

                }


                // =========================
                // EXISTING RATING
                // =========================

                const ratingSnapshot =
                    await transaction.get(
                        ratingReference
                    );


                if (!ratingSnapshot.exists()) {

                    throw new Error(
                        "Your existing rating could not be found."
                    );

                }


                const existingRating =
                    Number(
                        ratingSnapshot.data().rating || 0
                    );


                const newTotal =
                    currentTotal -
                    existingRating +
                    selectedRating;


                const newCount =
                    currentCount;


                transaction.update(
                    ratingReference,
                    {
                        rating:
                            selectedRating,

                        updatedAt:
                            new Date()
                    }
                );


                transaction.update(
                    bookReference,
                    {
                        ratingTotal:
                            newTotal,

                        ratingCount:
                            newCount
                    }
                );


                return {

                    total:
                        newTotal,

                    count:
                        newCount

                };

            }
        );


        const newTotal =
            transactionResult.total;

        const newCount =
            transactionResult.count;


        userRatingDocumentId =
            ratingReference.id;

        userRating =
            selectedRating;


        highlightRating(
            selectedRating
        );


        const average =
            newCount > 0
                ? newTotal / newCount
                : 0;


        bookRating.textContent =
            average > 0
                ? `★ ${average.toFixed(1)}`
                : "★ New";


        ratingCount.textContent =
            `${newCount} ${
                newCount === 1
                    ? "rating"
                    : "ratings"
            }`;


        ratingMessage.textContent =
            "Your rating has been saved.";


    } catch (error) {

        console.error(
            "SUBMIT RATING ERROR:",
            error
        );

        ratingMessage.textContent =
            "Unable to save your rating.";

    }

}

// -------------------------
// HIGHLIGHT STARS
// -------------------------

function highlightRating(
    rating
) {

    if (!ratingStars) {
        return;
    }

    const buttons =
        ratingStars.querySelectorAll(
            "button"
        );

    buttons.forEach(
        (button) => {

            const value =
                Number(
                    button.dataset.rating
                );

            button.classList.toggle(
                "active",
                value <= rating
            );

        }
    );

}


// -------------------------
// RECALCULATE BOOK RATING
// -------------------------




        // =========================
        // LOAD CHAPTERS
        // =========================

        async function loadChapters(
    bookId
) {

    try {

       const chaptersQuery =
    query(
        collection(db, "chapters"),

        where(
            "bookId",
            "==",
            bookId
        ),

        where(
            "status",
            "==",
            "published"
        ),

        where(
            "isOriginal",
            "==",
            true
        ),

        orderBy(
            "number",
            "asc"
        )
    );

        const chaptersSnapshot =
            await getDocs(
                chaptersQuery
            );


        chapterList.innerHTML = "";
        const chapterCountStat =
    document.getElementById("chapterCountStat");


       if (chaptersSnapshot.empty) {

    if (chapterCountStat) {
        chapterCountStat.textContent = "0 Chapters";
    }

    chapterList.innerHTML = `
        <p>
            No published chapters yet.
        </p>
    `;

    return;
}

if (chapterCountStat) {
    chapterCountStat.textContent =
        `${chaptersSnapshot.size} ${
            chaptersSnapshot.size === 1
                ? "Chapter"
                : "Chapters"
        }`;
}

        chaptersSnapshot.forEach(
            (chapterSnapshot) => {

                const chapter =
                    chapterSnapshot.data();


                const chapterLink =
                    document.createElement(
                        "a"
                    );


                chapterLink.href =
                    `reader.html?book=${bookId}&chapter=${chapter.number}`;


                chapterLink.className =
                    "chapter-item";


                chapterLink.innerHTML = `

                    <div>

                        <span
                            class="chapter-number">
                            Chapter ${chapter.number}
                        </span>

                        <strong>
                            ${chapter.title || `Chapter ${chapter.number}`}
                        </strong>

                    </div>

                    <span
                        class="chapter-arrow">
                        →
                    </span>

                `;


                chapterList.appendChild(
                    chapterLink
                );

            }
        );


    } catch (error) {

        console.error(
            "CHAPTERS ERROR:",
            error
        );


        chapterList.innerHTML = `

            <p>
                Unable to load chapters.
            </p>

        `;

    }

}


        // =========================
        // ERROR MESSAGE
        // =========================

        function showError(
            message
        ) {

            bookTitle.textContent =
                "Unable to load book";


            bookDescription.textContent =
                message;


            chapterList.innerHTML = "";

        }


        // =========================
        // INITIALS
        // =========================

        function getInitials(
            title
        ) {

            if (!title) {

                return "BK";

            }


            const words =
                title
                    .trim()
                    .split(/\s+/);


            if (
                words.length === 1
            ) {

                return words[0]
                    .substring(0, 2)
                    .toUpperCase();

            }


            return (
                words[0][0] +
                words[1][0]
            ).toUpperCase();

        }


        // =========================
        // START
        // =========================

        loadBook();

    </script>

</body>
