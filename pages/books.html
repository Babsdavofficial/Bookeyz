<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Books — Bookeyz</title>

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>


<body>

    <header class="navbar">

        <a
            href="../index.html"
            class="logo">

            Bookeyz

        </a>


        <nav>

            <a href="../index.html">
                Home
            </a>

            <a href="books.html">
                Books
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <main>

        <section class="page-header">

            <p
                class="section-label"
                id="pageLabel">

                EXPLORE BOOKEYZ

            </p>


            <h1 id="pageTitle">

                All Books

            </h1>


            <p id="pageDescription">

                Explore stories across different worlds,
                genres, and adventures.

            </p>

        </section>


        <section class="section">

    <div
        class="book-grid"
        id="booksGrid">

        <p>
            Loading books...
        </p>

    </div>


    <div
        class="load-more-container"
        id="loadMoreContainer"
        style="display: none;">

        <button
            type="button"
            id="loadMoreButton">

            More Books

        </button>

    </div>

</section>

    </main>


    <footer class="footer">

        <div class="footer-logo">
            Bookeyz
        </div>

        <p>
            Stories worth getting lost in.
        </p>

    </footer>

<script type="module">

    import {
        collection,
        getDocs,
        query,
        where,
        orderBy,
        limit,
        startAfter
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    import {
        db
    } from "../js/firebase-config.js";


    // =========================
    // ELEMENTS
    // =========================

    const booksGrid =
        document.getElementById(
            "booksGrid"
        );


    const pageLabel =
        document.getElementById(
            "pageLabel"
        );


    const pageTitle =
        document.getElementById(
            "pageTitle"
        );


    const pageDescription =
        document.getElementById(
            "pageDescription"
        );


    const loadMoreContainer =
        document.getElementById(
            "loadMoreContainer"
        );


    const loadMoreButton =
        document.getElementById(
            "loadMoreButton"
        );


    // =========================
    // PAGINATION
    // =========================

    const BOOKS_PER_PAGE = 20;

    let lastVisibleBook = null;

    let isLoadingMore = false;


    // =========================
    // URL PARAMETERS
    // =========================

    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const selectedCategory =
        urlParams.get(
            "category"
        );


    const searchTerm =
        urlParams.get(
            "search"
        );

        const selectedSort =
    urlParams.get(
        "sort"
    );


    // =========================
    // LOAD BOOKS
    // =========================

 async function loadBooks() {

    try {

        if (selectedCategory) {

            await loadCategoryBooks();

            return;

        }


        if (searchTerm) {

            await loadSearchResults();

            return;

        }


        if (selectedSort === "popular") {

            await loadPopularBooks();

            return;

        }


        if (selectedSort === "new") {

            await loadNewReleases();

            return;

        }


        await loadAllBooks();

    } catch (error) {

        console.error(
            "BOOKS ERROR:",
            error
        );


        booksGrid.innerHTML = `

            <p>
                Unable to load books.
            </p>

        `;

        loadMoreContainer.style.display =
            "none";

    }

}


// =========================
// LOAD NEW RELEASES
// =========================

async function loadNewReleases(
    loadMore = false
) {

    pageLabel.textContent =
        "FRESH STORIES";


    pageTitle.textContent =
        "New Releases";


    pageDescription.textContent =
        "Discover the latest stories published on Bookeyz.";


    if (!loadMore) {

        booksGrid.innerHTML = `

            <p>
                Loading new releases...
            </p>

        `;

        lastVisibleBook = null;

    }


    const queryParts = [

        collection(
            db,
            "books"
        ),

        where(
            "status",
            "==",
            "published"
        ),

        orderBy(
            "createdAt",
            "desc"
        ),

        limit(
            BOOKS_PER_PAGE
        )

    ];


    if (
        loadMore &&
        lastVisibleBook
    ) {

        queryParts.push(
            startAfter(
                lastVisibleBook
            )
        );

    }


    const booksQuery =
        query(
            ...queryParts
        );


    const snapshot =
        await getDocs(
            booksQuery
        );


    if (!loadMore) {

        booksGrid.innerHTML = "";

    }


    displayBooks(
        snapshot.docs,
        "No new releases yet.",
        true
    );


    if (
        snapshot.docs.length <
        BOOKS_PER_PAGE
    ) {

        loadMoreContainer.style.display =
            "none";

    } else {

        loadMoreContainer.style.display =
            "flex";

    }


    if (!snapshot.empty) {

        lastVisibleBook =
            snapshot.docs[
                snapshot.docs.length - 1
            ];

    }

}



// =========================
// LOAD POPULAR BOOKS
// =========================

async function loadPopularBooks(
    loadMore = false
) {

    pageLabel.textContent =
        "READERS ARE EXPLORING";


    pageTitle.textContent =
        "Popular Stories";


    pageDescription.textContent =
        "Discover the stories readers are exploring most.";


    if (!loadMore) {

        booksGrid.innerHTML = `

            <p>
                Loading popular stories...
            </p>

        `;

        lastVisibleBook = null;

    }


    const queryParts = [

        collection(
            db,
            "books"
        ),

        where(
            "status",
            "==",
            "published"
        ),

        orderBy(
            "readerCount",
            "desc"
        ),

        limit(
            BOOKS_PER_PAGE
        )

    ];


    if (
        loadMore &&
        lastVisibleBook
    ) {

        queryParts.push(
            startAfter(
                lastVisibleBook
            )
        );

    }


    const booksQuery =
        query(
            ...queryParts
        );


    const snapshot =
        await getDocs(
            booksQuery
        );


    if (!loadMore) {

        booksGrid.innerHTML = "";

    }


    displayBooks(
        snapshot.docs,
        "No popular stories yet.",
        true
    );


    if (
        snapshot.docs.length <
        BOOKS_PER_PAGE
    ) {

        loadMoreContainer.style.display =
            "none";

    } else {

        loadMoreContainer.style.display =
            "flex";

    }


    if (!snapshot.empty) {

        lastVisibleBook =
            snapshot.docs[
                snapshot.docs.length - 1
            ];

    }

}

    // =========================
    // LOAD ALL BOOKS
    // =========================

    async function loadAllBooks(
        loadMore = false
    ) {

        pageLabel.textContent =
            "EXPLORE BOOKEYZ";


        pageTitle.textContent =
            "All Books";


        pageDescription.textContent =
            "Explore stories across different worlds, genres, and adventures.";


        if (!loadMore) {

            booksGrid.innerHTML = `

                <p>
                    Loading books...
                </p>

            `;

            lastVisibleBook = null;

        }


        const queryParts = [

            collection(
                db,
                "books"
            ),

            where(
                "status",
                "==",
                "published"
            ),

            orderBy(
                "createdAt",
                "desc"
            ),

            limit(
                BOOKS_PER_PAGE
            )

        ];


        if (
            loadMore &&
            lastVisibleBook
        ) {

            queryParts.push(
                startAfter(
                    lastVisibleBook
                )
            );

        }


        const booksQuery =
            query(
                ...queryParts
            );


        const snapshot =
            await getDocs(
                booksQuery
            );


        if (!loadMore) {

            booksGrid.innerHTML = "";

        }


        displayBooks(
            snapshot.docs,
            "No published books yet.",
            true
        );


        if (
            snapshot.docs.length <
            BOOKS_PER_PAGE
        ) {

            loadMoreContainer.style.display =
                "none";

        } else {

            loadMoreContainer.style.display =
                "flex";

        }


        if (!snapshot.empty) {

            lastVisibleBook =
                snapshot.docs[
                    snapshot.docs.length - 1
                ];

        }

    }


    // =========================
    // LOAD CATEGORY BOOKS
    // =========================

    async function loadCategoryBooks(
        loadMore = false
    ) {

        pageLabel.textContent =
            "CATEGORY";


        pageTitle.textContent =
            selectedCategory;


        pageDescription.textContent =
            `Explore ${selectedCategory} stories on Bookeyz.`;


        if (!loadMore) {

            booksGrid.innerHTML = `

                <p>
                    Loading books...
                </p>

            `;

            lastVisibleBook = null;

        }


        const queryParts = [

            collection(
                db,
                "books"
            ),

            where(
                "status",
                "==",
                "published"
            ),

            where(
                "category",
                "==",
                selectedCategory
            ),

            orderBy(
                "createdAt",
                "desc"
            ),

            limit(
                BOOKS_PER_PAGE
            )

        ];


        if (
            loadMore &&
            lastVisibleBook
        ) {

            queryParts.push(
                startAfter(
                    lastVisibleBook
                )
            );

        }


        const booksQuery =
            query(
                ...queryParts
            );


        const snapshot =
            await getDocs(
                booksQuery
            );


        if (!loadMore) {

            booksGrid.innerHTML = "";

        }


        displayBooks(
            snapshot.docs,
            `No books found in ${selectedCategory} yet.`,
            true
        );


        if (
            snapshot.docs.length <
            BOOKS_PER_PAGE
        ) {

            loadMoreContainer.style.display =
                "none";

        } else {

            loadMoreContainer.style.display =
                "flex";

        }


        if (!snapshot.empty) {

            lastVisibleBook =
                snapshot.docs[
                    snapshot.docs.length - 1
                ];

        }

    }


    // =========================
    // SEARCH
    // =========================

    async function loadSearchResults() {

        const cleanSearchTerm =
            searchTerm
                .trim()
                .toLowerCase();


        pageLabel.textContent =
            "SEARCH";


        pageTitle.textContent =
            "Search Results";


        pageDescription.textContent =
            `Showing results for "${searchTerm}"`;


        loadMoreContainer.style.display =
            "none";


        if (!cleanSearchTerm) {

            await loadAllBooks();

            return;

        }


        const booksQuery =
            query(

                collection(
                    db,
                    "books"
                ),

                where(
                    "status",
                    "==",
                    "published"
                ),

                orderBy(
                    "createdAt",
                    "desc"
                )

            );


        const snapshot =
            await getDocs(
                booksQuery
            );


        const matchingBooks =
            snapshot.docs.filter(
                (documentSnapshot) => {

                    const book =
                        documentSnapshot.data();


                    const title =
                        (
                            book.title ||
                            ""
                        ).toLowerCase();


                    const author =
                        (
                            book.author ||
                            ""
                        ).toLowerCase();


                    const category =
                        (
                            book.category ||
                            ""
                        ).toLowerCase();


                    const tags =
                        Array.isArray(
                            book.tags
                        )

                            ? book.tags
                                .join(" ")
                                .toLowerCase()

                            : (
                                book.tags ||
                                ""
                            ).toLowerCase();


                    return (

                        title.includes(
                            cleanSearchTerm
                        )

                        ||

                        author.includes(
                            cleanSearchTerm
                        )

                        ||

                        category.includes(
                            cleanSearchTerm
                        )

                        ||

                        tags.includes(
                            cleanSearchTerm
                        )

                    );

                }
            );


        displayBooks(
            matchingBooks,
            `No books found for "${searchTerm}".`,
            false
        );

    }


    // =========================
    // MORE BOOKS BUTTON
    // =========================

    loadMoreButton.addEventListener(
        "click",
        async () => {

            if (isLoadingMore) {
                return;
            }


            isLoadingMore = true;


            loadMoreButton.disabled =
                true;


            loadMoreButton.textContent =
                "Loading...";


            try {

                if (selectedCategory) {

    await loadCategoryBooks(true);

} else if (searchTerm) {

    // Search currently does not use pagination.

} else if (selectedSort === "popular") {

    await loadPopularBooks(true);

} else if (selectedSort === "new") {

    await loadNewReleases(true);

} else {

    await loadAllBooks(true);

}

            } catch (error) {

                console.error(
                    "LOAD MORE ERROR:",
                    error
                );

            } finally {

                isLoadingMore =
                    false;

                loadMoreButton.disabled =
                    false;

                loadMoreButton.textContent =
                    "More Books";

            }

        }
    );


    // =========================
    // DISPLAY BOOK CARDS
    // =========================

    function displayBooks(
        documents,
        emptyMessage = "No published books yet.",
        append = false
    ) {

        if (!append) {

            booksGrid.innerHTML =
                "";

        }


        if (
            documents.length === 0 &&
            !append
        ) {

            booksGrid.innerHTML = `

                <p>
                    ${emptyMessage}
                </p>

            `;

            return;

        }


        documents.forEach(
            (documentSnapshot) => {

                const book =
                    documentSnapshot.data();


                const bookId =
                    documentSnapshot.id;


                const cover =
                    book.coverImage;


                const coverContent =
                    cover

                        ? `

                            <img
                                src="${cover}"
                                alt="${escapeHTML(
                                    book.title ||
                                    "Book"
                                )} cover"
                            >

                          `

                        : `

                            <div class="cover-placeholder">

                                ${getInitials(
                                    book.title
                                )}

                            </div>

                          `;


                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "book-card";


                const ratingTotal =
                    Number(
                        book.ratingTotal ||
                        0
                    );


                const ratingCount =
                    Number(
                        book.ratingCount ||
                        0
                    );


                const rating =
                    ratingCount > 0

                        ? ratingTotal /
                            ratingCount

                        : 0;


                card.innerHTML = `

                    <a
                        href="book.html?id=${bookId}"
                        class="book-card"
                    >

                        <div class="book-cover">

                            ${coverContent}

                        </div>


                        <div class="book-info">

                            <p class="book-category">

                                ${escapeHTML(
                                    book.category ||
                                    "Uncategorized"
                                )}

                            </p>


                            <h3>

                                ${escapeHTML(
                                    book.title ||
                                    "Untitled Book"
                                )}

                            </h3>


                            <p class="book-meta">

                                ★
                                ${
                                    rating > 0
                                        ? rating.toFixed(1)
                                        : "New"
                                }

                                <span>

                                    ·
                                    ${
                                        ratingCount === 1
                                            ? "1 rating"
                                            : `${ratingCount} ratings`
                                    }

                                </span>

                            </p>

                        </div>

                    </a>

                `;


                booksGrid.appendChild(
                    card
                );

            }
        );

    }


    // =========================
    // GET INITIALS
    // =========================

    function getInitials(
        title
    ) {

        if (!title) {

            return "BK";

        }


        const words =
            title
                .trim()
                .split(/\s+/);


        if (
            words.length === 1
        ) {

            return words[0]
                .substring(
                    0,
                    2
                )
                .toUpperCase();

        }


        return (
            words[0][0] +
            words[1][0]
        ).toUpperCase();

    }


    // =========================
    // HTML SAFETY
    // =========================

    function escapeHTML(
        value
    ) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    // =========================
    // START
    // =========================

    loadBooks();

</script>
   

</body>

</html>
