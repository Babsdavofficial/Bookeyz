<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Books — Bookeyz</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="navbar">

        <a href="../index.html" class="logo">
            Bookeyz
        </a>

        <nav>
            <a href="../index.html">Home</a>
            <a href="books.html">Books</a>
            <a href="categories.html">Categories</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <main>

        <section class="page-header">

            <p class="section-label" id="pageLabel">
                EXPLORE BOOKEYZ
            </p>

            <h1 id="pageTitle">
                All Books
            </h1>

            <p id="pageDescription">
                Explore stories across different worlds,
                genres, and adventures.
            </p>

        </section>


        <section class="section">

            <div
                class="book-grid"
                id="booksGrid"
            >

                <p id="loadingMessage">
                    Loading books...
                </p>

            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="footer-logo">
            Bookeyz
        </div>

        <p>
            Stories worth getting lost in.
        </p>

    </footer>


    <script type="module">

        import {
            collection,
            getDocs,
            query,
            where,
            orderBy
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        import {
            db
        } from "../js/firebase-config.js";


        const booksGrid =
            document.getElementById(
                "booksGrid"
            );


        const pageTitle =
            document.getElementById(
                "pageTitle"
            );


        const pageDescription =
            document.getElementById(
                "pageDescription"
            );


        /*
         * Read the category from the URL.
         *
         * Example:
         *
         * books.html?category=Fantasy
         */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const selectedCategory =
            urlParams.get("category");


        async function loadBooks() {

            try {

                let booksQuery;


                /*
                 * If a category was selected,
                 * only get books from that category.
                 */

                if (selectedCategory) {

                    pageTitle.textContent =
                        selectedCategory;


                    pageDescription.textContent =
                        `Explore ${selectedCategory} stories on Bookeyz.`;


                    booksQuery =
                        query(
                            collection(
                                db,
                                "books"
                            ),

                            where(
                                "status",
                                "==",
                                "published"
                            ),

                            where(
                                "category",
                                "==",
                                selectedCategory
                            ),

                            orderBy(
                                "createdAt",
                                "desc"
                            )
                        );

                }


                /*
                 * Otherwise show every
                 * published book.
                 */

                else {

                    booksQuery =
                        query(
                            collection(
                                db,
                                "books"
                            ),

                            where(
                                "status",
                                "==",
                                "published"
                            ),

                            orderBy(
                                "createdAt",
                                "desc"
                            )
                        );

                }


                const snapshot =
                    await getDocs(
                        booksQuery
                    );


                booksGrid.innerHTML = "";


                if (snapshot.empty) {

                    booksGrid.innerHTML = `

                        <p>
                            No books found in
                            ${selectedCategory || "Bookeyz"}
                            yet.
                        </p>

                    `;

                    return;

                }


                snapshot.forEach(
                    (documentSnapshot) => {

                        const book =
                            documentSnapshot.data();


                        const bookId =
                            documentSnapshot.id;


                        const cover =
                            book.coverImage;


                        const coverContent =
                            cover
                                ? `
                                    <img
                                        src="${cover}"
                                        alt="${book.title} cover"
                                    >
                                  `
                                : `
                                    <div class="cover-placeholder">
                                        ${getInitials(book.title)}
                                    </div>
                                  `;


                        const card =
                            document.createElement(
                                "article"
                            );


                        card.className =
                            "book-card";


                        card.innerHTML = `

                            <a
                                href="book.html?id=${bookId}"
                                class="book-card"
                            >

                                <div class="book-cover">

                                    ${coverContent}

                                </div>


                                <div class="book-info">

                                    <p class="book-category">
                                        ${book.category || "Uncategorized"}
                                    </p>


                                    <h3>
                                        ${book.title}
                                    </h3>


                                    <p class="book-meta">

                                        ★
                                        ${book.ratingAverage || "New"}

                                    </p>

                                </div>

                            </a>

                        `;


                        booksGrid.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "BOOK FILTER ERROR:",
                    error
                );


                booksGrid.innerHTML = `

                    <p>
                        Unable to load books.
                    </p>

                `;

            }

        }


        function getInitials(title) {

            if (!title) {

                return "BK";

            }


            const words =
                title
                    .trim()
                    .split(/\s+/);


            if (words.length === 1) {

                return words[0]
                    .substring(0, 2)
                    .toUpperCase();

            }


            return (
                words[0][0] +
                words[1][0]
            ).toUpperCase();

        }


        loadBooks();

    </script>

</body>

</html>
